name: Deploy Paint-o-matic to shinyapps.io

on:
  push:
    branches: [ main, master ]
    paths:
      - 'paint-o-matic/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paint-o-matic

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'

      # # THIS LINE MAKES IT FAST
      # - uses: r-lib/actions/setup-renv@v2
      #   with:
      #     cache-version: 2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('shiny','shinydashboard','shinyjs','shinyWidgets','rsconnect'), repos='https://cran.r-project.org')"

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_NAME:   ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e "
            rsconnect::setAccountInfo(
              name   = Sys.getenv('SHINYAPPS_NAME'),
              token  = Sys.getenv('SHINYAPPS_TOKEN'),
              secret = Sys.getenv('SHINYAPPS_SECRET')
            );
            rsconnect::deployApp(
              appDir = '.',
              appName = 'paint-o-matic',
              launch.browser = FALSE,
              forceUpdate = TRUE
            )"
