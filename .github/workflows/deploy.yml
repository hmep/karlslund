# Deploy paint-o-matic to shinyapps.io
#
# This workflow provides flexible deployment options:
#
# 1. AUTOMATIC DEPLOYMENT via commit message:
#    - Add [deploy] anywhere in your commit message
#    - Example: git commit -m "Update color mixing logic [deploy]"
#    - Push to main branch to trigger deployment
#
# 2. MANUAL DEPLOYMENT via GitHub Actions UI:
#    - Go to Actions tab → "Deploy paint-o-matic to shinyapps.io"
#    - Click "Run workflow" button
#    - Check "Force deployment" box to deploy regardless of commit message
#    - Click "Run workflow" to start deployment
#
# Required Secrets (Settings → Secrets and variables → Actions → New repository secret):
#   - SHINYAPPS_ACCOUNT: Your shinyapps.io account name
#   - SHINYAPPS_TOKEN: API token from shinyapps.io
#   - SHINYAPPS_SECRET: API secret from shinyapps.io

name: Deploy paint-o-matic to shinyapps.io

on:
  push:
    branches: [ main, master ]
    paths:
      - 'paint-o-matic/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment regardless of commit message'
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy paint-o-matic to shinyapps.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paint-o-matic
    # Deploy if manually forced OR if commit message contains [deploy]
    if: github.event.inputs.force_deploy == 'true' || contains(github.event.head_commit.message || '', '[deploy]')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'

      # THIS LINE MAKES IT FAST
      # - uses: r-lib/actions/setup-renv@v2
      #   with:
      #     cache-version: 3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('shiny','shinydashboard','shinyjs','shinyWidgets','rsconnect','jsonlite','memoise'), repos='https://cran.r-project.org')"

      - name: Verify PWA files exist
        run: |
          echo "Checking for PWA files..."
          ls -la www/manifest.json || echo "WARNING: manifest.json not found!"
          ls -la www/service-worker.js || echo "WARNING: service-worker.js not found!"
          ls -la www/service-worker-register.js || echo "WARNING: service-worker-register. js not found!"
          ls -la www/icons/icon-192.png || echo "WARNING: icon-192.png not found!"
          ls -la www/icons/icon-512.png || echo "WARNING: icon-512. png not found!"

      - name: Deploy to shinyapps. io
        env:
          SHINYAPPS_NAME:   ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e "
            rsconnect::setAccountInfo(
              name   = Sys.getenv('SHINYAPPS_NAME'),
              token  = Sys.getenv('SHINYAPPS_TOKEN'),
              secret = Sys.getenv('SHINYAPPS_SECRET')
            );
            
            # List all files to deploy explicitly
            app_files <- c(
              'app.R',
              'global.R',
              'kulturkulor_recipes.r',
              'kulturkulor_recipes_part2.r',
              'kulturkulor_recipes_part3.r',
              list.files('R', full.names = TRUE, recursive = TRUE),
              'www/manifest.json',
              'www/service-worker. js',
              'www/service-worker-register.js',
              list.files('www/css', full.names = TRUE, recursive = TRUE),
              list.files('www/js', full.names = TRUE, recursive = TRUE),
              list.files('www/icons', full.names = TRUE, recursive = TRUE)
            );
            
            # Filter out files that don't exist
            app_files <- app_files[file.exists(app_files)];
            
            cat('Deploying files:\n');
            print(app_files);
            
            rsconnect::deployApp(
              appDir = '.',
              appFiles = app_files,
              appName = 'paint-o-matic',
              launch.browser = FALSE,
              forceUpdate = TRUE
            )"